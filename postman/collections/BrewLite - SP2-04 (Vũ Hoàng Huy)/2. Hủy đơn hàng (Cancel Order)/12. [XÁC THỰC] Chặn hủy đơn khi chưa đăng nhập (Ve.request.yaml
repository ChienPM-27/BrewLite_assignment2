$kind: http-request
name: 12. [XÁC THỰC] Chặn hủy đơn khi chưa đăng nhập (Verify 401)
description: Gọi API hủy đơn nhưng không truyền Header Authorization -> JwtAuthGuard chặn với 401 Unauthorized.
url: "{{baseUrl}}/orders/{{orderId}}/cancel"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("Verify trả về HTTP 401 Unauthorized khi không có Bearer token", function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 4000
