$kind: http-request
name: 06. [BẢO MẬT GIÁ] Chống giả mạo giá từ Client (Client Price Tampering)
description: "Client cố tình gửi unitPrice: 1, totalAmount: 2. Chứng minh PricingService Backend tự đọc giá từ DB và bỏ qua giá gian lận."
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "items": [
        {
          "productId": "{{productId}}",
          "size": "L",
          "quantity": 2,
          "toppingIds": [
            "{{toppingId1}}"
          ],
          "basePrice": 1,
          "unitPrice": 1,
          "subtotal": 2,
          "totalAmount": 2
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Backend BẢO MẬT: Chặn đứng giá giả mạo (400) hoặc Tự tính lại giá chuẩn (201)", function () {
          pm.expect([201, 400]).to.include(pm.response.code);
      });

      const res = pm.response.json();

      if (pm.response.code === 400) {
          pm.test("Backend từ chối nhận payload gian lận giá (Validation Guard)", function () {
              pm.expect(res.message).to.be.an('array');
              console.log("✅ Backend chặn thành công với 400 Bad Request:", res.message);
          });
      } else if (pm.response.code === 201) {
          const order = res.data;
          pm.test("Backend tính lại giá chuẩn từ DB (Không bị lừa bởi giá 1 đồng)", function () {
              pm.expect(Number(order.totalAmount)).to.be.above(10000);
              pm.expect(Number(order.totalAmount)).to.not.equal(2);
          });
      }
    language: text/javascript
order: 6000
