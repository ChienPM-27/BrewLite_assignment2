$kind: http-request
name: "TC-DETAIL-04 (AC-08.2): Chặn chọn vượt quá 3 Topping (400 Bad Request)"
description: "Ánh xạ AC-08.2: Gửi 4 topping trong một dòng món -> Backend chặn đứng bằng 400 Bad Request."
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "items": [
        {
          "productId": "{{productId}}",
          "size": "M",
          "quantity": 1,
          "toppingIds": ["top_1", "top_2", "top_3", "top_4"]
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC-DETAIL-04: Status code 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
      const res = pm.response.json();
      pm.test("TC-DETAIL-04: Báo lỗi vượt quá tối đa 3 topping", function () {
          const msg = JSON.stringify(res.message);
          pm.expect(msg).to.match(/3 topping|not more than 3 elements/i);
      });
    language: text/javascript
order: 8000
