$kind: http-request
name: "TC-DETAIL-06 (AC-07.3): ID sai định dạng regex (400 Bad Request)"
description: "Ánh xạ AC-07.3: ID vi phạm biểu thức chính quy ^[A-Za-z0-9_-]{1,64}$ -> Backend trả về 400 Bad Request."
url: "{{baseUrl}}/products/bad!id@chars#regex"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC-DETAIL-06: Status code 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
      const res = pm.response.json();
      pm.test("TC-DETAIL-06: Báo lỗi ID không hợp lệ", function () {
          pm.expect(res.message).to.include("ID sản phẩm không hợp lệ");
      });
    language: text/javascript
order: 5000
