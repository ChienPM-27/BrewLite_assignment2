$kind: http-request
name: 00. [KHỞI TẠO] Lấy danh mục món -> Tự lưu Product & Topping
description: Lấy danh sách món để nạp ID cho các test case bên dưới.
url: "{{baseUrl}}/products"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code là 200 OK", function () {
          pm.response.to.have.status(200);
      });
      const res = pm.response.json();
      const items = res.data || [];
      pm.test("Catalog có sản phẩm khả dụng", function () {
          pm.expect(items.length).to.be.above(0);
      });
      if (items.length > 0) {
          const item = items.find(p => p.name.includes('Cà phê sữa')) || items[0];
          pm.collectionVariables.set("productId", item.id);
          pm.collectionVariables.set("productName", item.name);
          pm.collectionVariables.set("productBasePrice", String(item.basePrice));
          console.log("Đã lưu món test:", item.name, "- ID:", item.id, "- Giá gốc:", item.basePrice);
      }
    language: text/javascript
order: 2000
