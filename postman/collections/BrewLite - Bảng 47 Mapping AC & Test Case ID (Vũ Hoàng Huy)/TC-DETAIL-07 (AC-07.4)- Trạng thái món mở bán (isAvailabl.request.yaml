$kind: http-request
name: "TC-DETAIL-07 (AC-07.4): Trạng thái món mở bán (isAvailable & stock > 0)"
description: "Ánh xạ AC-07.4: Kiểm tra trạng thái khả dụng của món. Nếu món ngừng bán (isAvailable = false) giao diện sẽ disable nút đặt món."
url: "{{baseUrl}}/products/{{productId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC-DETAIL-07: Status code 200 OK", function () {
          pm.response.to.have.status(200);
      });
      const res = pm.response.json();
      const prod = res.data;
      pm.test("TC-DETAIL-07: Sản phẩm mở bán có isAvailable = true", function () {
          pm.expect(prod.isAvailable).to.equal(true);
      });
    language: text/javascript
order: 6000
