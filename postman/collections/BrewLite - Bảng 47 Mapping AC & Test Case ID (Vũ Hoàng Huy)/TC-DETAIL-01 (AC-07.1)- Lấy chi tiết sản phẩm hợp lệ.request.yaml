$kind: http-request
name: "TC-DETAIL-01 (AC-07.1): Lấy chi tiết sản phẩm hợp lệ (Happy Path)"
description: "Ánh xạ AC-07.1: Gọi GET /products/:id trả về 200 OK với đầy đủ thông tin chi tiết, ảnh, giá gốc, danh sách size và topping."
url: "{{baseUrl}}/products/{{productId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC-DETAIL-01: Status code 200 OK", function () {
          pm.response.to.have.status(200);
      });
      const res = pm.response.json();
      const prod = res.data;
      pm.test("TC-DETAIL-01: Trả về đầy đủ id, name, basePrice, currency, isAvailable", function () {
          pm.expect(prod.id).to.equal(pm.collectionVariables.get("productId"));
          pm.expect(prod).to.have.property('name');
          pm.expect(prod).to.have.property('basePrice');
          pm.expect(prod.currency).to.equal('VND');
          pm.expect(prod.isAvailable).to.equal(true);
      });
      pm.test("TC-DETAIL-01: Trả về danh sách sizePrices và toppings", function () {
          pm.expect(prod.sizePrices).to.be.an('array').that.is.not.empty;
          pm.expect(prod.toppings).to.be.an('array');
      });
      if (prod.toppings && prod.toppings.length >= 2) {
          pm.collectionVariables.set("toppingId1", prod.toppings[0].id);
          pm.collectionVariables.set("toppingPrice1", String(prod.toppings[0].price));
          pm.collectionVariables.set("toppingId2", prod.toppings[1].id);
          pm.collectionVariables.set("toppingPrice2", String(prod.toppings[1].price));
      }
    language: text/javascript
order: 3000
