$kind: http-request
name: "TC-DETAIL-02 (AC-07.2): Sản phẩm không tồn tại (404 Not Found)"
description: "Ánh xạ AC-07.2: Truy vấn ID đúng định dạng nhưng không có trong database -> Backend trả về 404 Not Found."
url: "{{baseUrl}}/products/san-pham-khong-ton-tai-9999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC-DETAIL-02: Status code 404 Not Found", function () {
          pm.response.to.have.status(404);
      });
      const res = pm.response.json();
      pm.test("TC-DETAIL-02: Thông báo lỗi sản phẩm không tồn tại", function () {
          pm.expect(res.error).to.equal("Not Found");
      });
    language: text/javascript
order: 4000
