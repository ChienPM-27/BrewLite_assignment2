$kind: http-request
name: "TC-DETAIL-13 (AC-09.6): Chặn khi danh sách items rỗng"
description: "Ánh xạ AC-09.6: Gửi items: [] -> Backend chặn bằng 400 Bad Request."
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "items": []
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC-DETAIL-13: Status code 400 Bad Request khi items rỗng", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 17000
