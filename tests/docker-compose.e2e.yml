# Stack E2E riêng cho SP2-08 (ADR-009 mục 3.4 và 3.6).
# - Tách khỏi docker-compose.yml của môi trường dev: project, container, port và volume riêng.
# - API chỉ chạy `prisma migrate deploy`, KHÔNG chạy seed. Dữ liệu test do tests/fixtures tạo và dọn.
# - Postgres không publish port ra máy host; script fixture chạy bên trong mạng của compose.
# - Mật khẩu/JWT bên dưới chỉ dùng cho DB tạm của E2E (cùng cách với ci.yml), không phải secret thật.
# Cách chạy chuẩn: `npm --prefix tests run e2e:local` (xem tests/README.md).
name: brewlite-e2e

x-e2e-database-url: &e2e-database-url "postgresql://brewlite_e2e:${E2E_DB_PASSWORD:-change-me-e2e-only}@e2e-postgres:5432/brewlite_e2e?schema=public"

services:
  e2e-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brewlite_e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:-change-me-e2e-only}
      POSTGRES_DB: brewlite_e2e
    volumes:
      - e2e_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite_e2e -d brewlite_e2e"]
      interval: 3s
      timeout: 5s
      retries: 20

  e2e-api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: brewlite-e2e-api:local
    environment:
      PORT: 4000
      # Bắt buộc khác "production" để API nhận header X-Mock-Outcome (E2E-02).
      NODE_ENV: development
      DATABASE_URL: *e2e-database-url
      DIRECT_URL: *e2e-database-url
      JWT_SECRET: ${E2E_JWT_SECRET:-change-me-e2e-only}
      JWT_EXPIRATION: 2h
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main"]
    ports:
      - "${E2E_API_PORT:-4100}:4000"
    depends_on:
      e2e-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  e2e-web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        # Được gắn vào bundle lúc build: trình duyệt của Playwright gọi API qua port đã publish.
        NEXT_PUBLIC_API_URL: http://localhost:${E2E_API_PORT:-4100}/api/v1
        NEXT_PUBLIC_DEMO_MODE: "true"
    image: brewlite-e2e-web:local
    ports:
      - "${E2E_WEB_PORT:-3100}:3000"
    depends_on:
      e2e-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  # Chạy script fixture bằng chính image API (Prisma Client đã khớp schema.prisma).
  # Chỉ dùng qua: docker compose --profile tools run --rm -T e2e-fixtures e2e-fixtures/<script>.cjs
  e2e-fixtures:
    image: brewlite-e2e-api:local
    pull_policy: never
    profiles: ["tools"]
    entrypoint: ["node"]
    environment:
      DATABASE_URL: *e2e-database-url
      E2E_RUN_ID: ${E2E_RUN_ID:-}
    volumes:
      - ./fixtures:/app/e2e-fixtures:ro
      - ./.e2e-run:/app/e2e-run:ro
    depends_on:
      e2e-postgres:
        condition: service_healthy

volumes:
  e2e_postgres_data:
